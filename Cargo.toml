[workspace]
resolver = "2"
members = [
    "crates/lzt-wallcraft-core",
    "crates/lzt-wallcraft-cli",
    "crates/lzt-wallcraft-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lou Mireles <davidmirelesll@outlook.com>"]
repository = "https://github.com/louzt/lzt-wallcraft"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime (net-unix is included via `net`)
tokio = { version = "1", features = ["fs", "process", "net", "sync", "time", "macros", "rt-multi-thread"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem
walkdir = "2"
notify = "7"

# Process / signal control (nix is needed for SIGSTOP/SIGCONT/SIGUSR1/SIGUSR2 to LWE)
nix = { version = "0.29", features = ["signal", "fs", "feature"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Time / dates
chrono = { version = "0.4", features = ["serde"] }

# Path helpers
dirs = "5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
