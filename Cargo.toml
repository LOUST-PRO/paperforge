[workspace]
resolver = "2"
members = [
    "crates/paperforge-core",
    "crates/paperforge-cli",
    "crates/paperforge-tui", "crates/paperforge-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lou Mireles <davidmirelesll@outlook.com>"]
repository = "https://github.com/LOUST-PRO/paperforge"
homepage = "https://github.com/LOUST-PRO/paperforge"
readme = "README.md"
publish = true
rust-version = "1.75"
keywords = ["wallpaper", "wallpaper-engine", "wayland", "linux", "workshop"]
categories = ["command-line-utilities", "api-bindings", "filesystem"]
[workspace.dependencies]
# Async runtime (net-unix is included via `net`)
tokio = { version = "1", features = ["fs", "process", "net", "sync", "time", "macros", "rt-multi-thread"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem
walkdir = "2"
notify = "7"

# Process / signal control (nix is needed for SIGSTOP/SIGCONT/SIGUSR1/SIGUSR2 to LWE)
nix = { version = "0.29", features = ["signal", "fs", "feature"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Time / dates
chrono = { version = "0.4", features = ["serde"] }

# Path helpers
dirs = "5"

# TOML serialization (config + updater.toml)
toml = "0.8"

# SHA-256 hashing (used by self-update for SHA256SUMS verification)
sha2 = "0.10"

# Tempdir for self-update staging area
tempfile = "3"

# File mtime setter (used by self-update backup pruning tests)
filetime = "0.2"

# D-Bus IPC service (Fase 6D — zbus-based daemon control)
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Stream combinators (used by ipc/client.rs MessageStream iteration)
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"
