# Example config.toml for `paperforge`.
#
# Place at: $XDG_CONFIG_HOME/paperforge/config.toml
# (typically `~/.config/paperforge/config.toml`).
#
# All fields are optional. Omitting the file is equivalent to using
# the defaults shown below.

# Which backend to use. Today only "linux-wallpaperengine" is wired.
# Future: "swww", "hyprpaper", "mpvpaper".
backend = "linux-wallpaperengine"

# Optional: path to the backend binary. If unset, paperforge
# resolves "linux-wallpaperengine" via $PATH.
# backend_binary = "/opt/lwe/bin/linux-wallpaperengine"

# Additional wallpaper source directories, on top of the
# auto-detected ones. Each is walked recursively.
# extra_sources = [
#   "/srv/wallpapers",
#   "/opt/wp",
# ]

# Auto-pause wallpapers when a game is detected (fullscreen +
# process-name match). Requires the companion `lzt-wallpaper-governor`
# daemon — this flag just signals it's desired.
auto_pause_on_game = true

# Auto-mute audio when fullscreen / game is detected. Same caveat.
auto_mute_on_fullscreen = true
