name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # paperforge-gui (Dioxus desktop) is excluded from the workspace build
      # (see Makefile target `release` -> `--exclude paperforge-gui`), so we
      # don't need webkit2gtk/gtk3/glib on the runner. If you fork this
      # workflow for your own runner and DO build the GUI, install:
      #   libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
      #   libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
      #   libxdo-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same note as clippy: paperforge-gui is excluded, GUI deps not needed.
      - name: Run unit tests
        run: cargo test --workspace --exclude paperforge-gui --no-fail-fast
      - name: Run doc tests
        run: cargo test --workspace --exclude paperforge-gui --doc

  build:
    name: build (release)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same note: paperforge-gui excluded, GUI deps not needed.
      - run: cargo build --release --workspace --exclude paperforge-gui --locked
      - name: Smoke test (binary runs)
        run: |
          ./target/release/paperforge --version
          ./target/release/paperforge --help
          ./target/release/paperforge paths