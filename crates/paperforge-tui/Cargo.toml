[package]
name = "paperforge-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["tui", "ratatui", "wallpaper", "debugger", "wayland", "linux"]
categories = ["command-line-utilities", "development-tools::debugging"]
publish.workspace = true
documentation = "https://docs.rs/paperforge-tui"
description = """
Read-only TUI debugger for paperforge — live view of Wayland outputs,
running LWE PIDs + state, playlists, and wallpaper inventory. Four
panels on independent timers (2s / 5s / 10s / 30s), vim-friendly keys.
"""

[dependencies]
paperforge-core = { path = "../paperforge-core", version = "0.1.0" }

# Workspace-wide
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# Used by data.rs (inventory size summary) and lib.rs (config dir).
walkdir = { workspace = true }
dirs = { workspace = true }

# TUI rendering
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

# Async runtime (TUI uses tokio for the data fetchers)
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
