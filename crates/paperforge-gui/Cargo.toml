[package]
name = "paperforge-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["gui", "dioxus", "wallpaper", "desktop", "wayland"]
categories = ["gui", "command-line-utilities"]
publish.workspace = true
documentation = "https://docs.rs/paperforge-gui"
description = """
Dioxus desktop GUI for paperforge — Phase 6C, in progress. Same core
library, lazy-load video previews and visual playlist editor.
"""

[dependencies]
# Dioxus GUI framework — pinned to 0.8.0-alpha per operator decision D2
# (PRs upstream al final del big picture; meanwhile patches en louzt/dioxus fork)
dioxus = { version = "=0.8.0-alpha.0", features = ["desktop"] }
dioxus-desktop = "=0.8.0-alpha.0"

# Internal: reuso del core lib MIT (Fase 6A)
paperforge-core = { path = "../paperforge-core", version = "0.1.0" }

# Async runtime + logging (reutilizados del workspace, per paperforge-core)
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# D-Bus IPC client (used in PR 4 for `PaperforgeClient` reconnection)
zbus = { workspace = true }

# Stream combinators for `MessageStream` iteration in `ipc/client.rs`
futures-util = { workspace = true }

# Error helpers in PR 3 data modules (spawn_blocking JoinError wrapping)
anyhow = { workspace = true }

# XDG path resolution for the playlist store root (matches TUI behavior)
dirs = { workspace = true }

# Image decode + resize + encode (PR 8.1 thumbnails). Pinned to
# 0.25.x to match the version already resolved transitively in the
# workspace lockfile (Cargo.lock pins 0.25.10).
image = "0.25"

# base64 encode for data URLs (`<img src="data:image/png;base64,...">`).
# Phase 1 of Fase 6C.1 — Phase 2 may switch to a `dioxus-desktop` custom
# protocol scheme to avoid inline base64 bloat for larger inventories.
base64 = "0.22"

# SHA-256 for thumbnail cache key (PR 8.1). Reused from workspace so
# the version matches `paperforge-core` (lockfile-pinned `0.10`).
sha2 = { workspace = true }

[features]
default = []
devtools = ["dioxus-desktop/devtools"]

[dev-dependencies]
# Tempdir helpers in data module tests
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }