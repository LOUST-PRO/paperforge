[package]
name = "paperforge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
documentation = "https://docs.rs/paperforge-core"
description = """
Core library for paperforge — Workshop wallpaper inventory, LWE backend
IPC via POSIX signals, per-monitor playlists, audio toggle, and a
trait-based backend abstraction (swww / hyprpaper / mpvpaper).
"""

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
nix = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
async-trait = "0.1"
toml = "0.8"
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
filetime = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
