# Hardening drop-in for paperforge.service
#
# Loaded automatically when present at:
#   ~/.config/systemd/user/paperforge.service.d/10-hardening.conf
#
# Adjust MemoryHigh / MemoryMax to match your monitor count and
# workshop scene complexity. Defaults below assume 3 monitors with
# mid-weight scenes (250 MiB LWE RSS × 3 + 16 MiB daemon = ~770 MiB).
# Drop MemoryMax to 96M if you run on a single monitor and want
# firmer capping.

[Unit]
# Restart-throttling: 5 restarts within 120 s before giving up.
# Prevents tight crash loops from spamming journal.
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
# Graceful shutdown window for SIGTERM. The daemon's hotplug
# watcher + LWE pool need ~2 s to release child processes; 15 s
# leaves headroom for hung children before SIGKILL.
KillSignal=SIGTERM
TimeoutStopSec=15

# Memory caps. The daemon itself uses ~12 MiB resident; LWE
# children each use ~250 MiB and are tracked separately by the
# kernel cgroup, so these caps protect the daemon process only.
# If you want to cap the entire tree (daemon + LWE children),
# set Delegate=yes on the unit and use MemoryMax=800M here.
MemoryHigh=96M
MemoryMax=128M

# Journal tagging (matches what we set in the unit; redundant
# here so the drop-in alone produces clean journal output if
# someone applies it to a unit without SyslogIdentifier).
SyslogIdentifier=paperforge