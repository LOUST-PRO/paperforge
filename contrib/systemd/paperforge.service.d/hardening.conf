[Unit]
# Crash-loop protection: cap restarts at 5 per 120s. If the daemon
# is wedged (panic in D-Bus task, niri IPC dead-lock), systemd stops
# trying to bring it back instead of thrashing.
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
# Graceful shutdown: SIGTERM -> wait_for_shutdown_signal() drains
# the LWE pool + aborts the hotplug dispatcher. TimeoutStopSec=15s
# covers the worst-case DBus method in flight. Past 15s, systemd
# sends SIGKILL.
KillSignal=SIGTERM
TimeoutStopSec=15

# Delegate=yes is REQUIRED for paperforge to spawn LWE into a
# separate slice via `systemd-run --user --scope`. Without this,
# the user manager refuses scope creation and LWE spawn fails
# with `Failed to create transient scope unit: Access denied`.
#
# Trade-off: paperforge can manipulate its own cgroup subtree.
# Acceptable because paperforge is our own trusted code. The
# hardening we lose on this axis is recovered by isolating LWE
# in paperforge-lwe.slice (MemoryHigh=512M, MemoryMax=1G) so a
# runaway renderer can't exhaust system memory.
Delegate=yes

# paperforge itself is a thin orchestrator (~10 MiB resident at
# idle, ~30 MiB during scene swaps). The LWE renderer goes to
# paperforge-lwe.slice via systemd-run --scope - separate cgroup,
# separate cap. paperforge's cap is a runaway-detection net for
# orchestrator bugs only.
#
# If you see LWE throttling in `dmesg` with `__mem_cgroup_handle_over_high`,
# the cap on paperforge-lwe.slice is too low - bump that, not this one.
MemoryHigh=32M
MemoryMax=64M

SyslogIdentifier=paperforge